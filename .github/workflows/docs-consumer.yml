name: docs-consumer

on:
  pull_request:
    paths:
      - "python/src/**"
      - "docs/**"
      - "python/samples/**"
      - "scripts/**"
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/docs-consumer.yml"
  push:
    branches: [main]
    paths:
      - "python/src/**"
      - "docs/**"
      - "python/samples/**"
      - "scripts/**"
      - ".github/workflows/docs-consumer.yml"

jobs:
  consumer:
    name: docs-consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Minor version only — patch pins (e.g. 3.11.9) are not always
          # published for every runner image (Ubuntu 26.04 lacks 3.11.9).
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel to local feed
        run: python scripts/local-wheel.py

      - name: Install sample from local feed only
        run: |
          python -m venv .venv-consumer
          VENV_PY=.venv-consumer/bin/python
          [ -f "$VENV_PY" ] || VENV_PY=.venv-consumer/Scripts/python.exe
          "$VENV_PY" -m pip install --no-index --find-links artifacts python/samples/scratch_consumer
        shell: bash

      - name: Run sample consumer
        run: |
          VENV_PY=.venv-consumer/bin/python
          [ -f "$VENV_PY" ] || VENV_PY=.venv-consumer/Scripts/python.exe
          "$VENV_PY" -m scratch_consumer.main
        shell: bash

      - name: Verify doc snippets
        run: python scripts/docs-snippets.py
